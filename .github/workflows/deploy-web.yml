name: Publicar panel web (GitHub Pages)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpeta Web faltante (no toca lib/ ni pubspec.yaml)
        run: flutter create . --platforms=web --org com.posible.app --project-name posible

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar panel web
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
