name: Build APK

on:
  workflow_dispatch: {}   # solo se compila a pedido, no en cada push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpeta Android faltante (no toca lib/ ni pubspec.yaml)
        run: flutter create . --platforms=android --org com.posible.app --project-name posible

      - name: Asegurar permisos de Internet y cámara en Android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
          grep -n 'uses-permission' "$MANIFEST" || echo "sin permisos declarados"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: posible-apk
          path: build/app/outputs/flutter-apk/app-release.apk
