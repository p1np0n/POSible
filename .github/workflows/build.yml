name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # permite apretar "Run workflow" manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generar carpeta Android faltante (no toca lib/ ni pubspec.yaml)
        run: flutter create . --platforms=android --org com.posible.app --project-name posible

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: posible-apk
          path: build/app/outputs/flutter-apk/app-release.apk
